name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Docker preflight
        run: docker info

      - name: Make mvnw executable
        run: chmod +x mvnw

      # Runs the full Maven test suite (against real PostgreSQL via
      # Testcontainers, using the runner's own Docker engine) and then
      # packages the jar in the same invocation. The package step also runs
      # the React build (frontend-maven-plugin), so the uploaded jar is
      # backend + a fresh React bundle, exactly what the Docker image ships.
      - name: Test and package
        run: ./mvnw -B -ntp clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: quizhub-jar
          path: target/*.jar
          retention-days: 3
          if-no-files-found: error

  container-smoke:
    name: Container Smoke Test
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Smoke-test secrets are generated fresh on the runner and never
      # touch repository/production secrets, so this stage works
      # unmodified on pull requests from forks.
      - name: Generate smoke-test environment
        run: |
          set -euo pipefail
          {
            echo "DB_USERNAME=quizhub"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "GOOGLE_CLIENT_ID=ci-smoke-test"
            echo "GOOGLE_CLIENT_SECRET=ci-smoke-test"
            echo "SPRING_MAIL_USERNAME=ci-smoke-test@example.com"
            echo "SPRING_MAIL_PASSWORD=ci-smoke-test"
            echo "JWT_SECRET=$(openssl rand -hex 40)"
            echo "GEMINI_API_KEY=ci-smoke-test"
            echo "SQL_INIT_MODE=never"
            echo "APP_PORT=8080"
            echo "DB_HOST_PORT=5433"
          } > "$RUNNER_TEMP/smoke.env"

      - name: Build and start the stack
        run: docker compose --env-file "$RUNNER_TEMP/smoke.env" up -d --build

      - name: Wait for containers to become healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            db_status=$(docker inspect --format='{{.State.Health.Status}}' quizhub-postgres 2>/dev/null || echo "missing")
            app_status=$(docker inspect --format='{{.State.Health.Status}}' quizhub-backend 2>/dev/null || echo "missing")
            echo "attempt $i: db=$db_status app=$app_status"
            if [ "$db_status" = "healthy" ] && [ "$app_status" = "healthy" ]; then
              echo "Stack is healthy"
              exit 0
            fi
            if [ "$app_status" = "unhealthy" ] || [ "$db_status" = "unhealthy" ]; then
              echo "A container reported unhealthy"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for the stack to become healthy"
          exit 1

      - name: Verify the app container runs as non-root
        run: |
          set -euo pipefail
          uid=$(docker exec quizhub-backend id -u)
          echo "Container UID: $uid"
          if [ "$uid" = "0" ]; then
            echo "Container is running as root"
            exit 1
          fi

      - name: Verify /actuator/health over HTTP
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8080/actuator/health)
          cat /tmp/health.json
          echo
          if [ "$code" != "200" ]; then
            echo "Expected HTTP 200, got $code"
            exit 1
          fi
          grep -q '"status":"UP"' /tmp/health.json

      # React owns "/", the auth pages and the migrated student routes; the
      # API, actuator and the still-legacy Thymeleaf pages must not be captured.
      - name: Verify React and legacy route ownership
        run: |
          set -euo pipefail
          base=http://localhost:8080

          # Failures are emitted as ::error:: annotations so the cause is visible without log access.
          # Bodies are captured first and searched with here-strings, so no check depends on
          # early-exit pipe/SIGPIPE behavior under pipefail.
          fail() { echo "::error::$1"; exit 1; }

          for path in / /login /register /forgot-password; do
            body=$(curl -fsS "$base$path") || fail "GET $path failed"
            grep -q 'id="root"' <<< "$body" || fail "$path did not serve the React shell"
          done

          login_html=$(curl -fsS "$base/login") || fail "GET /login failed"
          asset=$(grep -o '/app/assets/[^"]*\.js' <<< "$login_html" | head -n 1 || true)
          [ -n "$asset" ] || fail "No built asset referenced by the React shell"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base$asset")
          [ "$code" = "200" ] || fail "Built asset $asset returned $code"

          for path in /student /student/quizzes /teacher /admin; do
            result=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$base$path")
            echo "$path -> $result"
            grep -q '^302 .*/login?returnUrl=' <<< "$result" \
              || fail "$path should redirect anonymous users to /login (got: $result)"
          done

          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/student/dashboard")
          [ "$code" = "401" ] || fail "API returned $code instead of 401"

          register=$(curl -fsS -X POST "$base/api/auth/register" -H 'Content-Type: application/json' \
            -d '{"fullName":"Smoke Teacher","email":"smoke-teacher@example.com","password":"Passw0rd!","confirmPassword":"Passw0rd!","role":"TEACHER"}') \
            || fail "Could not register the smoke teacher"
          token=$(sed -n 's/.*"token":"\([^"]*\)".*/\1/p' <<< "$register")
          [ -n "$token" ] || fail "Could not obtain a teacher token"

          page=$(curl -fsS -H "Authorization: Bearer $token" "$base/teacher") || fail "GET /teacher failed for a teacher"
          if grep -q 'id="root"' <<< "$page"; then fail "/teacher was captured by the React shell"; fi
          grep -qi '<html' <<< "$page" || fail "/teacher did not render a legacy page"

          # Sprint 2A: public first-login route, /profile for any signed-in role, and the practice routes.
          body=$(curl -fsS "$base/oauth2-choose-role.html") || fail "GET /oauth2-choose-role.html failed"
          grep -q 'id="root"' <<< "$body" || fail "/oauth2-choose-role.html did not serve the React shell"

          result=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$base/profile")
          grep -q '^302 .*/login?returnUrl=' <<< "$result" || fail "/profile should redirect anonymous users (got: $result)"

          body=$(curl -fsS -H "Authorization: Bearer $token" "$base/profile") || fail "GET /profile failed for a teacher"
          grep -q 'id="root"' <<< "$body" || fail "/profile did not serve the React shell for a teacher"

          student=$(curl -fsS -X POST "$base/api/auth/register" -H 'Content-Type: application/json' \
            -d '{"fullName":"Smoke Student","email":"smoke-student@example.com","password":"Passw0rd!","confirmPassword":"Passw0rd!","role":"STUDENT"}') \
            || fail "Could not register the smoke student"
          stoken=$(sed -n 's/.*"token":"\([^"]*\)".*/\1/p' <<< "$student")
          [ -n "$stoken" ] || fail "Could not obtain a student token"

          for path in /profile /student/practice /student/practice/play /student/practice/review/1 /student/practice-history; do
            body=$(curl -fsS -H "Authorization: Bearer $stoken" "$base$path") || fail "GET $path failed for a student"
            grep -q 'id="root"' <<< "$body" || fail "$path was not served by the React shell"
          done

          for path in /student/categories /student/practice/personal-play; do
            body=$(curl -fsS -H "Authorization: Bearer $stoken" "$base$path") || fail "GET $path failed for a student"
            if grep -q 'id="root"' <<< "$body"; then fail "$path (still legacy) was captured by the React shell"; fi
            grep -qi '<html' <<< "$body" || fail "$path did not render a legacy page"
          done

          # A teacher must not get the student-only practice shell.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$base/student/practice")
          [ "$code" != "200" ] || fail "/student/practice was served to a teacher"

          # Never-SPA prefixes: none of these may return the React shell.
          for path in /api/student/dashboard /actuator/health /oauth2/authorization/google /login/oauth2/code/google /avatars/none.png; do
            body=$(curl -s -H "Authorization: Bearer $stoken" "$base$path" || true)
            if grep -q 'id="root"' <<< "$body"; then fail "$path was captured by the React shell"; fi
          done
          echo "Route ownership verified"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  e2e:
    name: E2E
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same throwaway-credentials approach as the smoke test: nothing here
      # touches repository or production secrets.
      - name: Generate E2E environment
        run: |
          set -euo pipefail
          {
            echo "DB_USERNAME=quizhub"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "GOOGLE_CLIENT_ID=ci-e2e"
            echo "GOOGLE_CLIENT_SECRET=ci-e2e"
            echo "SPRING_MAIL_USERNAME=ci-e2e@example.com"
            echo "SPRING_MAIL_PASSWORD=ci-e2e"
            echo "JWT_SECRET=$(openssl rand -hex 40)"
            echo "GEMINI_API_KEY=ci-e2e"
            echo "SQL_INIT_MODE=never"
            echo "APP_PORT=8080"
            echo "DB_HOST_PORT=5433"
          } > "$RUNNER_TEMP/e2e.env"

      - name: Build and start the stack
        run: docker compose --env-file "$RUNNER_TEMP/e2e.env" up -d --build

      - name: Wait for the app to become healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            app_status=$(docker inspect --format='{{.State.Health.Status}}' quizhub-backend 2>/dev/null || echo "missing")
            echo "attempt $i: app=$app_status"
            if [ "$app_status" = "healthy" ]; then exit 0; fi
            if [ "$app_status" = "unhealthy" ]; then echo "App reported unhealthy"; exit 1; fi
            sleep 5
          done
          echo "Timed out waiting for the app"
          exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  publish-image:
    name: Publish Image
    needs: [frontend-quality, backend-tests, container-smoke, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
