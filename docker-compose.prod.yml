services:
  quizhub-db:
    image: postgres:15-alpine
    container_name: quizhub-postgres
    environment:
      POSTGRES_DB: quiz_hub
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d quiz_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  quizhub-app:
    image: ${QUIZHUB_IMAGE:?QUIZHUB_IMAGE must be provided}
    container_name: quizhub-backend
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      quizhub-db:
        condition: service_healthy
    environment:
      # Nối thẳng vào container quizhub-db trên mạng nội bộ của Compose
      DB_URL: jdbc:postgresql://quizhub-db:5432/quiz_hub
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  pg_data:
  uploads_data:
