<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyệt Câu hỏi | QuizHub Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin/admin-moderation.css}">
</head>

<body>
    <script>
        (function () {
            const isCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';
            if (isCollapsed) document.body.classList.add('sidebar-collapsed');
        })();
    </script>
    <!-- Sidebar -->
    <aside th:replace="~{layout/sidebar :: admin-sidebar('moderation')}"></aside>
    <header th:replace="~{layout/header :: admin-header}"></header>

    <!-- Main Content -->
    <main id="main-content">
        <div class="page-title-box">
            <h4>Duyệt nội dung</h4>
            <p>Admin phê duyệt hoặc từ chối các câu hỏi đang chờ kiểm duyệt và gán vào danh mục hệ thống</p>
        </div>

        <!-- Filter Bar -->
        <div class="filter-group">
            <!-- Hàng 1: Tìm kiếm + Giáo viên + Danh mục -->
            <div class="row g-3 align-items-center">
                <div class="col-lg-4 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px; border-color: #e2e8f0;">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="filter-keyword" class="form-control fc-modern border-start-0"
                               placeholder="Tìm kiếm nội dung câu hỏi..." style="border-radius: 0 12px 12px 0;" oninput="debounceFetch()">
                    </div>
                </div>
                <div class="col-lg-3 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px; border-color: #e2e8f0;">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" id="filter-creator" class="form-control fc-modern border-start-0"
                               placeholder="Tìm theo giáo viên..." style="border-radius: 0 12px 12px 0;" oninput="onCreatorFilterChange()">
                    </div>
                </div>
                <div class="col-lg-5 col-md-12">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0" style="border-radius: 12px 0 0 12px; border-color: #e2e8f0;">
                            <i class="bi bi-folder2-open text-muted"></i>
                        </span>
                        <input type="text" id="filter-category-input" class="form-control fc-modern border-start-0"
                               placeholder="-- Nhập tên danh mục để tìm --" style="border-radius: 0 12px 12px 0;"
                               autocomplete="new-password" spellcheck="false" data-lpignore="true"
                               oninput="filterCustomCategory(this.value)" onclick="filterCustomCategory(this.value)">
                        <ul class="dropdown-menu shadow-sm" id="custom-category-dropdown" style="max-height: 250px; overflow-y: auto; width: 100%; position: absolute; top: 100%;">
                            <!-- populated dynamically -->
                        </ul>
                        <input type="hidden" id="filter-category">
                    </div>
                </div>
            </div>
            <!-- Hàng 2: Loại câu hỏi + Mức độ + Nút đặt lại -->
            <div class="row g-3 align-items-center mt-2">
                <div class="col-lg-5 col-md-5">
                    <select id="filter-type" class="form-select fc-modern" onchange="fetchPendingQuestions()">
                        <option value="">-- Loại câu hỏi --</option>
                        <option value="SINGLE_CHOICE">Một đáp án</option>
                        <option value="MULTIPLE_CHOICE">Nhiều đáp án</option>
                        <option value="FILL_IN_BLANK">Điền khuyết</option>
                    </select>
                </div>
                <div class="col-lg-5 col-md-5">
                    <select id="filter-level" class="form-select fc-modern" onchange="fetchPendingQuestions()">
                        <option value="">-- Mức độ --</option>
                        <option value="EASY">Dễ</option>
                        <option value="MEDIUM">Trung bình</option>
                        <option value="HARD">Khó</option>
                    </select>
                </div>
                <div class="col-lg-2 col-md-2 d-flex justify-content-end">
                    <button class="btn btn-reset-filter w-100" onclick="resetFilters()" title="Làm mới bộ lọc">
                        <i class="bi bi-arrow-clockwise me-1"></i> Đặt lại
                    </button>
                </div>
            </div>
        </div>

        <div class="dashboard-card">
            <!-- Bulk Selection Bar -->
            <div id="bulk-selection-bar" class="bulk-actions-bar">
                    <div class="d-flex flex-column">
                        <div class="d-flex align-items-center">
                            <div class="form-check me-3">
                                <input class="form-check-input" type="checkbox" id="selectAllQuestions" onchange="toggleSelectAll(this)">
                                <label class="form-check-label fw-bold ms-2" for="selectAllQuestions">Chọn tất cả</label>
                            </div>
                            <span id="selected-count-badge" class="badge bg-primary rounded-pill">0 đã chọn</span>
                        </div>
                        <div id="select-all-all-area" class="mt-1 small" style="display: none; padding-left: 32px; color: #1e40af;"></div>
                    </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-success fw-bold px-3 py-2" style="border-radius: 10px;" onclick="openBulkApproveModal()">
                        <i class="bi bi-check-circle-fill me-1"></i> Duyệt nhanh
                    </button>
                    <button class="btn btn-sm btn-danger fw-bold px-3 py-2" style="border-radius: 10px;" onclick="confirmBulkReject()">
                        <i class="bi bi-x-circle-fill me-1"></i> Từ chối nhanh
                    </button>
                </div>
            </div>

            <div id="questions-container">
                <!-- Ajax loading output -->
            </div>

            <!-- Pagination Bar -->
            <div class="pagination-bar" id="pagination-shell" style="display: none;">
                <div class="pagination-info" id="pagination-info">Hiển thị 1 đến 10 trong tổng số 0 câu hỏi</div>
                <div id="pagination-list"></div>
            </div>
        </div>
    </main>

    <!-- Reject Modal -->
    <div class="modal fade" id="rejectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.15);">
                <div class="modal-header fw-bold" style="background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fff; border-top-left-radius: 20px; border-top-right-radius: 20px;">
                    <h5 class="modal-title"><i class="bi bi-x-circle-fill me-2"></i>Từ chối Duyệt câu hỏi</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 text-center">
                    <i class="bi bi-exclamation-octagon text-danger" style="font-size: 3.5rem;"></i>
                    <h5 class="fw-bold mt-3 text-dark" id="rejectModalMsg">Bạn có chắc chắn muốn từ chối câu hỏi này?</h5>
                    <p class="text-muted small">Hành động này sẽ từ chối đưa câu hỏi lên hệ thống công khai.</p>
                </div>
                <div class="modal-footer p-3 bg-light" style="border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;">
                    <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal" style="border-radius:12px; padding:10px 24px;">Hủy</button>
                    <button type="button" class="btn btn-danger fw-bold" id="btnConfirmReject" style="border-radius:12px; padding:10px 24px;">Từ chối</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Wrap -->
    <div id="toast-wrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin/admin-moderation.js}"></script>
    
    <div th:replace="~{fragments/category-explorer-public :: category-explorer-public-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-explorer-private-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-create-modal}"></div>
    <th:block th:replace="~{fragments/category-explorer-private :: category-explorer-private-scripts('admin')}"></th:block>
    <div th:replace="~{layout/header :: changePasswordModal}"></div>
    <script th:replace="~{layout/header :: change-password-script}"></script>
</body>

</html>
