<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

    <!-- Fragment: Public Category Explorer Modal -->
    <div th:fragment="category-explorer-public-modal" class="modal fade" id="categoryExplorerPublicModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
                <div class="modal-header border-0 p-4" style="background: linear-gradient(135deg, #4f46e5, #3730a3); color: #ffffff;">
                    <h5 class="modal-title fw-bold text-white mb-0" style="color: #ffffff !important;">
                        <i class="bi bi-globe2 me-2"></i>Chọn Danh mục Công khai
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <p class="text-muted small mb-0"><i class="bi bi-info-circle me-1"></i> Bấm vào tên danh mục để chọn.</p>
                        <div id="explorer-public-create-btn-wrapper" style="display: none;">
                            <button type="button" class="btn btn-sm" style="background-color: rgba(79, 70, 229, 0.1); color: #4f46e5; border: 1px solid rgba(79, 70, 229, 0.2); font-weight: 600; border-radius: 8px; padding: 6px 12px;" onclick="openCreateCategoryModal(null, null, event)">
                                <i class="bi bi-plus-lg me-1"></i> Thêm mới
                            </button>
                        </div>
                    </div>
                    <div id="public-category-tree-container" style="max-height: 400px; overflow-y: auto; padding: 5px;">
                        <!-- JS renders public categories here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
