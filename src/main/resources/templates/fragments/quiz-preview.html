<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

    <!-- 1️⃣ Fragment: Quiz Preview Modal -->
    <div th:fragment="quiz-preview-modal" class="modal fade" id="previewQuizModal" tabindex="-1" aria-hidden="true">
        <link rel="stylesheet" th:href="@{/css/fragments/quiz-preview.css}">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content" style="border-radius:20px; border:none; box-shadow:0 15px 40px rgba(0,0,0,0.18);">
                <div class="modal-header border-0 px-4 pt-4">
                    <h5 class="modal-title fw-bold" style="color:#1e1b4b;"><i class="bi bi-journal-text me-2" style="color:#4338ca;"></i> Xem trước đề thi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body px-4 py-3" style="max-height: 65vh; overflow-y: auto;">
                    <div class="mb-4">
                        <h4 id="preview-quiz-title" class="fw-bold mb-1" style="color: #1e1b4b;"></h4>
                        <p id="preview-quiz-desc" class="text-muted small mb-0"></p>
                    </div>
                    <hr class="my-3">
                    <h6 class="fw-bold mb-3" style="color: #4338ca;"><i class="bi bi-list-ol me-1"></i> Danh sách câu hỏi trong đề (<span id="preview-quiz-count">0</span> câu):</h6>
                    <div id="preview-quiz-questions" class="d-flex flex-column gap-3"></div>
                </div>
                <div class="modal-footer border-0 px-4 pb-4">
                    <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal" style="border-radius:12px; padding:10px 24px;">Đóng lại</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
