<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizHub | Ngân hàng Câu hỏi Cá nhân</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet" th:href="@{/css/student/student-questions.css}">
</head>

<body>
    <!-- Student Header -->
    <header th:replace="~{layout/header :: student-header('myquestions')}"></header>

    <main id="main-content">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <!-- Question Bank UI Fragment -->
                    <div th:replace="~{fragments/question-bank-ui :: question-bank-ui('student', false)}"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Category Explorer Modals -->
    <div th:replace="~{fragments/category-explorer-private :: category-explorer-private-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-create-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-explorer-private-scripts('student')}"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.myCategories = /*[[${myCategories}]]*/[];
        /*]]>*/
    </script>
</body>

</html>
