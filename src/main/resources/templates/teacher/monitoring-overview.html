<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizHub | Giám sát phòng thi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .page-title {
            font-size: 24px;
            font-weight: 800;
            color: #1e293b;
            margin: 0;
        }
        .page-sub {
            color: #64748b;
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        .assignment-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .assignment-card:hover {
            border-color: var(--blue);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }
        .assignment-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #f0fdf4;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 20px;
        }
        .assignment-info {
            flex-grow: 1;
        }
        .assignment-title {
            font-weight: 700;
            font-size: 16px;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .assignment-meta {
            font-size: 13px;
            color: #64748b;
        }
        .assignment-meta span {
            margin-right: 15px;
        }
        .btn-monitor {
            background: #eff6ff;
            color: var(--blue);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-monitor:hover {
            background: var(--blue);
            color: #fff;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px dashed #cbd5e1;
        }
        .empty-state i {
            font-size: 48px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Sidebar Fragment -->
    <aside th:replace="~{layout/sidebar :: teacher-sidebar('monitoring')}"></aside>

    <!-- Header Fragment -->
    <header th:replace="~{layout/header :: teacher-header}"></header>

    <main id="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Giám sát phòng thi</h1>
                <p class="page-sub">Theo dõi và giám sát quá trình làm bài của học sinh theo từng bài tập.</p>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(assignments)}" class="empty-state">
            <i class="bi bi-display"></i>
            <h4 class="fw-bold mt-2">Chưa có bài kiểm tra nào</h4>
            <p class="text-muted">Bạn chưa giao bài tập hoặc đề thi nào cho các lớp học.</p>
        </div>

        <div th:unless="${#lists.isEmpty(assignments)}">
            <div th:each="assignment : ${assignments}" class="assignment-card">
                <div class="d-flex align-items-center">
                    <div class="assignment-icon">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <div class="assignment-info">
                        <div class="assignment-title" th:text="${assignment.quiz.title}">Đề thi giữa kỳ</div>
                        <div class="assignment-meta">
                            <span><i class="bi bi-people-fill me-1"></i> <span th:text="${assignment.classroom.name}">Lớp 10A1</span></span>
                            <span><i class="bi bi-clock me-1"></i> <span th:text="${assignment.durationInMins} + ' phút'">45 phút</span></span>
                        </div>
                    </div>
                </div>
                <a th:href="@{'/teacher/monitoring/log/' + ${assignment.id}}" class="btn-monitor">
                    <i class="bi bi-eye-fill me-1"></i> Vào giám sát
                </a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <div th:replace="~{layout/header :: changePasswordModal}"></div>
    <script th:replace="~{layout/header :: change-password-script}"></script>

</body>
</html>
