<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soạn Đề Thi | QuizHub Teacher</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacher-quiz-create.css}">
</head>

<body>
    <script>(function () { if (localStorage.getItem('sidebar-collapsed') === 'true') document.body.classList.add('sidebar-collapsed'); })()</script>
    <aside th:replace="~{layout/sidebar :: teacher-sidebar('categories-mine')}"></aside>
    <header th:replace="~{layout/header :: teacher-header}"></header>

    <main id="main-content" style="padding: 30px 30px 40px 30px !important;">
        <input type="hidden" id="quizIdInput" th:value="${quizId}">
        <input type="hidden" id="categoryIdInput" th:value="${categoryId}">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h1 class="page-title" style="font-size: 1.6rem;"><i class="bi bi-mortarboard-fill me-2 text-primary"></i>Soạn Đề Thi (Giáo viên)</h1>
            </div>
            <div class="d-flex gap-2">
                <a href="/teacher/categories?type=mine" class="btn btn-light fw-bold px-3 border shadow-sm btn-sm" style="background: #fff; color: #64748b; font-size: 0.9rem; padding: 8px 16px; border-radius: 12px !important;">
                    <i class="bi bi-chevron-left me-1"></i> Quay lại
                </a>
                <button type="button" class="btn btn-submit-quiz btn-sm" onclick="saveQuiz()" style="font-size: 0.9rem; padding: 8px 20px; border-radius: 12px !important;">
                    <i class="bi bi-floppy-fill me-2"></i> Lưu Đề Thi
                </button>
            </div>
        </div>

        <div th:replace="~{fragments/quiz-editor :: quiz-editor-ui(userType='teacher')}"></div>
    </main>

    <div th:replace="~{fragments/quiz-editor :: quiz-editor-modals}"></div>
    <div th:replace="~{fragments/category-explorer-public :: category-explorer-public-modal}"></div>
    <div th:replace="~{fragments/category-explorer-private :: category-explorer-private-modal}"></div>

    <div id="toastWrap"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <div th:replace="~{fragments/quiz-editor :: quiz-editor-scripts(userType='teacher')}"></div>
</body>

</html>
