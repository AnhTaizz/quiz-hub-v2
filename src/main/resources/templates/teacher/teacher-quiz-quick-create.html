<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Quiz Designer | QuizHub Teacher</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Nunito+Sans:wght@800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/quiz-quick-create.css}">
    <style>
        body {
            background: #f3f4f6;
            font-family: 'Inter', sans-serif;
            height: calc(100vh / 0.85) !important;
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-light">
    <!-- Sidebar -->
    <aside th:replace="~{layout/sidebar :: teacher-sidebar('quizzes')}"></aside>

    <!-- Wrapper -->
    <div id="wrapper" class="d-flex flex-column min-vh-100">
        <!-- Header -->
        <header th:replace="~{layout/header :: teacher-header}"></header>

        <div th:replace="~{fragments/quiz-quick-create-ui :: quiz-quick-create-body('teacher', '/teacher/quizzes')}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <th:block th:replace="~{fragments/quiz-quick-create-ui :: quiz-quick-create-scripts('teacher', '/teacher/quizzes')}"></th:block>
</body>

</html>
