<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết bài làm - QuizHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard-layout.css}">

    <link rel="stylesheet" th:href="@{/css/teacher/teacher-quiz-result.css}">
</head>
<body>
    <aside th:replace="~{layout/sidebar :: teacher-sidebar('classrooms')}"></aside>
    <header th:replace="~{layout/header :: teacher-header}"></header>

    <div id="resultLoading">
        <div class="loader-spinner mb-3"></div>
        <p class="fw-bold text-muted">Đang tải kết quả bài làm...</p>
    </div>

    <main id="main-content">
        <div class="container-fluid py-4">

            <!-- Back button -->
            <div class="d-flex align-items-center mb-4">
                <button class="btn btn-outline-secondary rounded-pill px-3 me-3" onclick="if(history.length > 1){ history.back(); } else { window.location.href='/teacher/classrooms'; }">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                </button>
                <h5 class="fw-800 m-0" style="color:#1e293b;">Chi tiết bài làm của học sinh</h5>
            </div>

            <div id="result-content" style="display:none;">
                <!-- ── Summary Card ── -->
                <div class="summary-card">
                    <div class="d-flex flex-wrap align-items-center gap-4">
                        <!-- Score ring -->
                        <div class="score-ring">
                            <span class="val" id="score-val">0.0</span>
                            <span class="lbl">Điểm</span>
                        </div>

                        <!-- Name + date -->
                        <div class="me-auto">
                            <div class="quiz-meta-name" id="quiz-title">Đang tải...</div>
                            <div class="quiz-meta-date" id="started-at">Ngày làm: ...</div>
                        </div>

                        <!-- Stat pills -->
                        <div class="d-flex flex-wrap gap-3">
                            <div class="stat-pill sp-green">
                                <div class="sp-icon"><i class="bi bi-check-circle-fill"></i></div>
                                <div>
                                    <div class="sp-val" id="correct-num">0</div>
                                    <div class="sp-lbl">Câu đúng</div>
                                </div>
                            </div>
                            <div class="stat-pill sp-red">
                                <div class="sp-icon"><i class="bi bi-x-circle-fill"></i></div>
                                <div>
                                    <div class="sp-val" id="incorrect-num">0</div>
                                    <div class="sp-lbl">Câu sai</div>
                                </div>
                            </div>
                            <div class="stat-pill sp-slate">
                                <div class="sp-icon"><i class="bi bi-list-ol"></i></div>
                                <div>
                                    <div class="sp-val" id="total-num">0</div>
                                    <div class="sp-lbl">Tổng câu</div>
                                </div>
                            </div>
                            <div class="stat-pill sp-blue">
                                <div class="sp-icon"><i class="bi bi-clock-fill"></i></div>
                                <div>
                                    <div class="sp-val" id="duration">0p</div>
                                    <div class="sp-lbl">Thời gian</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── Question Review ── -->
                <h4 class="review-title"><i class="bi bi-journal-text me-2 text-primary"></i>Xem lại chi tiết từng câu</h4>
                <div id="questionsReviewList"></div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        window.attemptId = /*[[${attemptId}]]*/ null;
    </script>
    <script th:src="@{/js/toast.js}"></script>
    <script th:src="@{/js/api-client.js}"></script>
    <script th:src="@{/js/teacher/teacher-quiz-result.js}"></script>
</body>
</html>
