<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizHub Toast Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Nhúng CSS Toast trực tiếp vào đây để demo chạy độc lập */
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast-item { pointer-events: auto; min-width: 320px; max-width: 450px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); border: 1px solid rgba(255, 255, 255, 0.5); transform: translateX(120%); transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); position: relative; overflow: hidden; font-family: 'Inter', sans-serif; }
        .toast-item.show { transform: translateX(0); }
        .toast-item.hide { transform: translateX(120%); opacity: 0; margin-top: -70px; }
        .toast-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .toast-content { flex-grow: 1; }
        .toast-title { font-weight: 700; font-size: 15px; color: #1e293b; margin-bottom: 2px; }
        .toast-message { font-size: 13px; color: #64748b; line-height: 1.4; }
        .toast-close { color: #94a3b8; cursor: pointer; font-size: 18px; transition: color 0.2s; padding: 4px; }
        .toast-close:hover { color: #475569; }
        .toast-success .toast-icon { background: #ecfdf5; color: #10b981; }
        .toast-success { border-left: 4px solid #10b981; }
        .toast-error .toast-icon { background: #fef2f2; color: #ef4444; }
        .toast-error { border-left: 4px solid #ef4444; }
        .toast-warning .toast-icon { background: #fffbeb; color: #f59e0b; }
        .toast-warning { border-left: 4px solid #f59e0b; }
        .toast-info .toast-icon { background: #eff6ff; color: #3b82f6; }
        .toast-info { border-left: 4px solid #3b82f6; }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; width: 100%; background: rgba(0, 0, 0, 0.05); }
        .toast-progress-bar { height: 100%; width: 100%; background: currentColor; opacity: 0.3; transform-origin: left; }
        @keyframes progress { from { transform: scaleX(1); } to { transform: scaleX(0); } }

        /* Style cho trang demo */
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; max-width: 500px; }
        h1 { color: #1e293b; margin-bottom: 1rem; }
        p { color: #64748b; margin-bottom: 2rem; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px 20px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-success { background: #10b981; color: white; }
        .btn-error { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-info { background: #3b82f6; color: white; }
        .btn-alert { background: #1e293b; color: white; grid-column: span 2; margin-top: 10px; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="card">
        <h1>QuizHub Toast Demo</h1>
        <p>Nhấn các nút bên dưới để thử nghiệm hệ thống thông báo mới đã được tích hợp vào dự án của bạn.</p>
        
        <div class="btn-group">
            <button class="btn-success" onclick="toast.success('Dữ liệu đã được lưu thành công!', 'Thành công')">Success</button>
            <button class="btn-error" onclick="toast.error('Mật khẩu không chính xác.', 'Lỗi')">Error</button>
            <button class="btn-warning" onclick="toast.warning('Vui lòng điền đầy đủ thông tin.', 'Cảnh báo')">Warning</button>
            <button class="btn-info" onclick="toast.info('Hệ thống sẽ bảo trì vào lúc 24h.', 'Thông báo')">Info</button>
            <button class="btn-alert" onclick="alert('Đây là hàm alert() truyền thống nhưng đã được nâng cấp!')">Dùng hàm alert() cũ</button>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const toast = (() => {
            let container = document.getElementById('toast-container');
            const icons = { success: 'bi-check-circle-fill', error: 'bi-exclamation-triangle-fill', warning: 'bi-exclamation-circle-fill', info: 'bi-info-circle-fill' };
            const show = ({ title = '', message = '', type = 'info', duration = 4000 }) => {
                const toastItem = document.createElement('div');
                toastItem.className = `toast-item toast-${type}`;
                const autoCloseTimeout = setTimeout(() => removeToast(toastItem), duration);
                toastItem.innerHTML = `
                    <div class="toast-icon"><i class="bi ${icons[type]}"></i></div>
                    <div class="toast-content">${title ? `<div class="toast-title">${title}</div>` : ''}<div class="toast-message">${message}</div></div>
                    <div class="toast-close"><i class="bi bi-x"></i></div>
                    <div class="toast-progress"><div class="toast-progress-bar" style="animation: progress ${duration}ms linear forwards; color: inherit;"></div></div>
                `;
                toastItem.querySelector('.toast-close').onclick = () => { clearTimeout(autoCloseTimeout); removeToast(toastItem); };
                container.appendChild(toastItem);
                requestAnimationFrame(() => toastItem.classList.add('show'));
            };
            const removeToast = (el) => { el.classList.add('hide'); el.addEventListener('transitionend', () => el.remove(), { once: true }); };
            return {
                success: (msg, title) => show({ message: msg, title, type: 'success' }),
                error: (msg, title) => show({ message: msg, title, type: 'error' }),
                warning: (msg, title) => show({ message: msg, title, type: 'warning' }),
                info: (msg, title) => show({ message: msg, title, type: 'info' })
            };
        })();

        window.alert = (msg) => {
            const lowerMsg = msg.toLowerCase();
            if (lowerMsg.includes('lỗi') || lowerMsg.includes('error')) toast.error(msg, 'Lỗi');
            else if (lowerMsg.includes('thành công') || lowerMsg.includes('success')) toast.success(msg, 'Thành công');
            else toast.info(msg, 'Thông báo');
        };
    </script>
</body>
</html>
